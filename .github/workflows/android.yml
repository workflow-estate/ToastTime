name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build web app and sync Android
        run: npm run android:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: toast-time-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode upload keystore
        id: signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Play App Bundle skipped. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD, then rerun this workflow."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Play App Bundle
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: "1.0.0"
        run: ./gradlew bundleRelease --stacktrace

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true'
        with:
          name: toast-time-play
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
